<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>EJC Post Occupancy Evaluation Survey</title>

  <!-- SurveyJS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/survey-core/survey-core.min.css"
  >

  <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-js-ui/survey-js-ui.min.js"></script>
  
</head>

<body>

  <div id="surveyContainer"></div>

  <script>
    /*
      Replace the URL below with your own Apps Script
      web app URL ending in /exec.
    */
    const GOOGLE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzy4HyXOg_UUhRMacoGs6t1jt_xDsUe3wo_ih_wn9s1NMpd_D3qPEa7OaXpPeA4M-55/exec";

    Promise.all([
      fetch("survey.json").then(response => {
        if (!response.ok) {
          throw new Error("Unable to load survey.json");
        }

        return response.json();
      }),

      fetch("survey_theme.json").then(response => {
        if (!response.ok) {
          throw new Error("Unable to load survey_theme.json");
        }

        return response.json();
      })
    ])
    .then(([surveyJson, surveyTheme]) => {
      const survey = new Survey.Model(surveyJson);

      survey.applyTheme(surveyTheme);

      function updateRankingChoices() {
        const ranking = survey.getQuestionByName("1-space");
      
        if (!ranking) return;
      
        // Selected Image Picker responses
        const selectedSpaces = survey.getValue("1-spaces") || [];
      
        // Text entered under Others
        const otherText =
          survey.getValue("1-others-Comment") || "";
      
        const combinedChoices = [...selectedSpaces];
      
        if (otherText.trim()) {
          combinedChoices.push(otherText.trim());
        }
      
        ranking.choices = combinedChoices;
      
        // Remove an old ranking answer if its choices changed
        const currentRanking = survey.getValue("1-space") || [];
      
        const validRanking = currentRanking.filter(
          value => combinedChoices.includes(value)
        );
      
        if (validRanking.length !== currentRanking.length) {
          survey.setValue("1-space", validRanking);
        }
      }
      
      // Update whenever either source question changes
      survey.onValueChanged.add(function(sender, options) {
        if (
          options.name === "1-spaces" ||
          options.name === "1-others" ||
          options.name === "1-others-Comment"
        ) {
          updateRankingChoices();
        }
      });

      if (window.matchMedia("(max-width: 768px)").matches) {
        const imagePicker = survey.getQuestionByName("1-spaces");

        if (imagePicker) {
          imagePicker.minImageWidth = 70;
          imagePicker.minImageHeight = 70;
          imagePicker.maxImageWidth = 70;
          imagePicker.maxImageHeight = 70;
        }
      }

      survey.onComplete.add(function(sender) {
        const completeResponse = {};

        // Include every question, even when it was not answered.
        sender.getAllQuestions().forEach(question => {
          const questionName = question.name;
          const questionType = question.getType();
          const answer = sender.data[questionName];

          // Create a separate Google Sheets column for every matrix row.
          if (questionType === "matrix") {
            question.rows.forEach(row => {
              const rowValue =
                typeof row === "object" ? row.value : row;

              const rowText =
                typeof row === "object"
                  ? (row.text || row.value)
                  : row;

              const columnName = `${questionName} - ${rowText}`;

              completeResponse[columnName] =
                answer && answer[rowValue] !== undefined
                  ? answer[rowValue]
                  : "";
            });

            return;
          }

          completeResponse[questionName] =
            answer !== undefined && answer !== null
              ? answer
              : "";
        });

        const payload = new URLSearchParams();

        payload.append(
          "payload",
          JSON.stringify(completeResponse)
        );

        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: payload
        })
        .then(() => {
          console.log("Survey response sent.");
        })
        .catch(error => {
          console.error(
            "Unable to send the survey response:",
            error
          );
        });
      });

      survey.render(
        document.getElementById("surveyContainer")
      );
    })
    .catch(error => {
      console.error(error);

      document.getElementById("surveyContainer").innerHTML =
        "<h2>Unable to load the survey.</h2>" +
        "<p>Please refresh the page or contact the survey administrator.</p>";
    });
  </script>

</body>
</html>
